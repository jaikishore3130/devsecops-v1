exclusion_reasons:
  IDENTIFIER: "Excluded to prevent entity memorization and preserve grouping/leakage controls."
  TARGET: "Excluded because it is the current detection target or its taxonomy."
  FUTURE_TARGET: "Excluded because it is only available after the detection cutoff."
  RCA_ONLY: "Excluded because it is a downstream synthetic RCA annotation, not detection evidence."
  REMEDIATION_ONLY: "Excluded because it is a recommendation target, not detection evidence."
  UNSAFE: "Excluded because the field is during-event, post-cutoff identity/time metadata, or raw time that can encode split membership."